name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Syntax check
        run: for f in *.js media/*.js test/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@4.0.0 package --out claude-sessions.vsix

      - name: List packaged files
        run: npx --yes @vscode/vsce@4.0.0 ls

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-sessions-vsix
          path: claude-sessions.vsix
