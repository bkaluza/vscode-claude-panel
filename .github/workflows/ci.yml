name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Syntax check
        run: for f in *.js media/*.js test/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@4.0.0 package --out claude-sessions.vsix

      - name: List packaged files
        run: npx --yes @vscode/vsce@4.0.0 ls

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-sessions-vsix
          path: claude-sessions.vsix
