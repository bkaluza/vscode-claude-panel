name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Syntax check
        run: for f in *.js media/*.js test/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@4.0.0 package --out claude-sessions.vsix

      - name: List packaged files
        run: npx --yes @vscode/vsce@4.0.0 ls

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-sessions-vsix
          path: claude-sessions.vsix
