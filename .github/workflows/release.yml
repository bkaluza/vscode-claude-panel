name: Release

# Push a tag like v0.7.0 (matching package.json's version) to publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # for the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    # The store steps are skipped until these secrets are set; the GitHub release is made either way.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - name: Syntax check
        run: for f in *.js media/*.js test/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@4.0.0 package --out "claude-sessions-$GITHUB_REF_NAME.vsix"

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath "claude-sessions-$GITHUB_REF_NAME.vsix"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.2.0 publish "claude-sessions-$GITHUB_REF_NAME.vsix"

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" "claude-sessions-$GITHUB_REF_NAME.vsix" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
